<style>
:root{--bg:#f7f0ec;--card:#fffaf7;--text:#3d2d35;--muted:#7b6a72;--accent:#8f5f76;--accent2:#c59aaa;--line:#e7d8df;--soft:#efe3e8;--shadow:0 12px 30px rgba(77,48,62,.10)}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#fbf6f2,#f4ebe7);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text)}.app{max-width:760px;margin:auto;padding:20px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.brandmini{display:flex;align-items:center;gap:10px}.brandmini img{width:42px;height:42px;border-radius:12px;object-fit:cover}.brandmini strong{font-size:14px}.version,.muted{font-size:12px;color:var(--muted)}.card{background:rgba(255,250,247,.97);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}.hero{text-align:center;padding-top:28px}.coach-corner{

    .coach-logo{width:min(190px,48%)!important;height:auto!important;object-fit:contain!important;border-radius:0!important;margin:16px auto 0!important;display:block!important}
    .hero img{width:min(250px,74%);border-radius:22px;margin:0 auto 14px;display:block}h1{font-size:34px;line-height:1.05;margin:6px 0 8px}h2{font-size:27px;line-height:1.12;margin:0 0 14px}h3{font-size:18px;margin:0 0 8px}p{line-height:1.5}.lead{font-size:18px;color:var(--muted)}.privacy{background:#f0ebe7;border:1px dashed #cebcc4;border-radius:18px;padding:16px}.progress{height:8px;background:#eadde3;border-radius:999px;overflow:hidden;margin:10px 0 20px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0}.stepnote{font-size:13px;color:var(--muted);margin-bottom:5px}.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button{font:inherit;border:0;border-radius:14px;padding:13px 18px;min-height:46px;cursor:pointer}.primary{background:var(--accent);color:#fff;font-weight:700;flex:1}.secondary{background:var(--soft);color:var(--text);font-weight:650}.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}button:disabled{opacity:.45;cursor:not-allowed}.field{margin:16px 0}label{display:block;font-weight:700;margin-bottom:8px}input[type=password],input[type=text],textarea{width:100%;border:1px solid #d8c8cf;border-radius:14px;padding:14px 15px;font:inherit;background:#fff;color:var(--text)}textarea{min-height:120px;resize:vertical}.areas{display:grid;gap:14px}.area{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px}.area-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.area small{display:block;color:var(--muted);margin-top:4px;line-height:1.4}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:14px}.scale button{padding:10px 0;border:1px solid var(--line);background:#fff;border-radius:12px}.scale button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}.legend{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:12px;gap:12px}.choicegrid{display:grid;gap:10px}.choice{width:100%;text-align:left;background:#fff;border:1px solid var(--line);padding:14px 16px;border-radius:14px}.choice.sel{border-color:var(--accent);background:#f5eaf0}.selected-summary{border-left:4px solid var(--accent);background:#f8eef3;padding:12px 14px;border-radius:12px;margin:14px 0}.pause{background:linear-gradient(180deg,#f4ecef,#fffaf7);text-align:center;padding:30px 18px;border-radius:20px;border:1px solid var(--line)}.pause .big{font-size:48px}.radarwrap{display:flex;justify-content:center;margin:8px 0 18px}svg.radar{width:min(100%,520px);height:auto}.summary{display:grid;gap:12px}.summary-item{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.summary-item b{display:block;margin-bottom:5px}.notice{font-size:14px;padding:12px 14px;border-radius:12px;background:#fff5dd;border:1px solid #edd7a1}.error{color:#a33b4a;font-size:14px;margin-top:8px}.hidden{display:none!important}@media(max-width:520px){.card{padding:18px;border-radius:20px}h1{font-size:30px}h2{font-size:24px}.app{padding:12px 10px 30px}.btnrow{flex-direction:column-reverse}.btnrow button{width:100%}}@media print{body{background:#fff}.top,.progress,.btnrow,.no-print,.stepnote{display:none!important}.app{max-width:100%;padding:0}.card{box-shadow:none;border:none}.print-title{display:block!important}}

<body>

  <div class="print-branding header">
    <span>🎒 Vacía tu Mochila | Mi Mochila Hoy</span>
    <span>Coach Ismael Andrade</span>
  </div>
  <div class="print-branding footer">
    <span>Experiencia Vivencial Online</span>
    <span>Coach Ismael Andrade | Vacía tu Mochila</span>
  </div>
<div class="app"><div class="top"><div class="brandmini"><img src="brand.png?v=1.8" alt="Vacía tu Mochila"><div><strong>Vacía tu Mochila</strong><div class="version">PWA v1.8</div></div></div><div class="version" id="statusMini">Guardado local</div></div><div class="stepnote" id="stepLabel"></div><div class="progress" id="progressWrap"><span id="progressBar"></span></div><main class="card" id="screen"></main></div>
<script>
(()=>{
const APP_KEY='vmo-state-v1',ACCESS_KEY='vmo-access-v1',PASS='vmo1';
const steps=['login','cover','privacy','areas','map','chooseArea','chooseLoad','q1','q2','pause','discover','different','release','action','summary'];
const labels={cover:'Inicio',privacy:'Privacidad',areas:'1 · Explorar',map:'2 · Observar',chooseArea:'3 · Elegir',chooseLoad:'3 · Elegir',q1:'4 · Profundizar',q2:'4 · Profundizar',pause:'4 · Profundizar',discover:'5 · Soltar',different:'5 · Soltar',release:'5 · Soltar',action:'6 · Actuar',summary:'Cierre'};
const areas=[['wellbeing','💛 Yo y mi bienestar','Tiempo para mí, autocuidado, energía, priorizarme.'],['relationships','❤️ Pareja y relaciones','Pareja, vínculos, amistades, límites.'],['family','👨‍👩‍👧 Familia','Hijos, padres, responsabilidades, expectativas.'],['work','💼 Trabajo y dinero','Profesión, negocio, responsabilidades y preocupaciones económicas.'],['dreams','🌱 Sueños y proyectos personales','Metas, proyectos, propósito y aquello que has ido postergando.']];
const loads=['😔 Culpa','😨 Miedo','🎯 Exigencia','🧠 Creencias','🤲 Responsabilidades que siento que debo asumir','⏳ Algo del pasado','🔄 Necesidad de control','➕ Otra'];
const screen=document.getElementById('screen'),progress=document.getElementById('progressBar'),progressWrap=document.getElementById('progressWrap'),stepLabel=document.getElementById('stepLabel');
function defaultState(){return{step:'cover',ratings:{},area:'',areaOther:'',load:'',loadOther:'',q1:'',q2:'',discover:'',different:'',release:'',action:''}}
function loadState(){try{return{...defaultState(),...(JSON.parse(localStorage.getItem(APP_KEY))||{})}}catch(e){return defaultState()}}
let state=loadState();if(!localStorage.getItem(ACCESS_KEY))state.step='login';else if(!state.step||state.step==='login')state.step='cover';
function save(){localStorage.setItem(APP_KEY,JSON.stringify(state));document.getElementById('statusMini').textContent='Guardado ✓'}
function setStep(s){state.step=s;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function nav(back,next,nextText='SIGUIENTE →',disabled=false){return `<div class="btnrow">${back?`<button class="secondary" id="backBtn">← ANTERIOR</button>`:''}${next?`<button class="primary" id="nextBtn" ${disabled?'disabled':''}>${nextText}</button>`:''}</div>`}
function bindNav(back,next){if(back)document.getElementById('backBtn')?.addEventListener('click',()=>setStep(back));if(next)document.getElementById('nextBtn')?.addEventListener('click',()=>setStep(next))}
function progressUI(){if(state.step==='login'){progressWrap.classList.add('hidden');stepLabel.textContent='';return}progressWrap.classList.remove('hidden');const idx=Math.max(0,steps.indexOf(state.step)-1),total=steps.length-2;progress.style.width=Math.min(100,Math.round(idx/total*100))+'%';stepLabel.textContent=labels[state.step]||''}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function displayArea(){return state.area==='➕ Otra área'?(state.areaOther.trim()||'Otra área'):state.area}
function displayLoad(){return state.load==='➕ Otra'?(state.loadOther.trim()||'Otra'):state.load}
function render(){progressUI();({login:renderLogin,cover:renderCover,privacy:renderPrivacy,areas:renderAreas,map:renderMap,chooseArea:renderChooseArea,chooseLoad:renderChooseLoad,q1:()=>renderTextQuestion('💭 ¿En qué situación sientes con mayor frecuencia esta carga?','q1','chooseLoad','q2'),q2:()=>renderTextQuestion('💭 Cuando esto ocurre, ¿qué sueles decirte a ti misma?','q2','q1','pause','Ej.: “Tengo que hacerlo”, “No puedo fallar”, “Qué van a pensar de mí”…'),pause:renderPause,discover:()=>renderTextQuestion('✨ ¿Qué descubriste o comprendiste sobre aquello que estabas cargando?','discover','pause','different'),different:()=>renderTextQuestion('🌱 ¿Qué te gustaría comenzar a hacer diferente?','different','discover','release'),release:()=>renderTextQuestion('🎒 ¿Qué quieres dejar de cargar de la misma manera?','release','different','action'),action:renderAction,summary:renderSummary}[state.step]||renderCover)()}
function renderLogin(){screen.innerHTML=`<div class="hero">
      <img src="brand.png?v=1.8" alt="Vacía tu Mochila">
      <h2>🔐 Acceso a la experiencia</h2>
      <p class="muted">Ingresa la clave compartida por Ismael.</p>
      <div class="field"><input id="pass" type="password" autocomplete="off" placeholder="Clave de acceso"></div>
      <div id="err" class="error"></div>
      <div class="btnrow"><button id="loginBtn" class="primary">INGRESAR</button></div>
      </div></div>`;const go=()=>{if(document.getElementById('pass').value.trim()===PASS){localStorage.setItem(ACCESS_KEY,'1');state.step='cover';save();render()}else document.getElementById('err').textContent='⚠️ La clave ingresada no es correcta. Inténtalo nuevamente.'};document.getElementById('loginBtn').addEventListener('click',go);document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter')go()})}
function renderCover(){screen.innerHTML=`<div class="hero">
      <img src="brand.png?v=1.8" alt="Vacía tu Mochila">
      <h1>🎒 VACÍA TU MOCHILA</h1>
      <h3>Mi Mochila Hoy</h3>
      <p class="lead">Un espacio para detenerte, observar lo que estás cargando y elegir conscientemente por dónde quieres comenzar.</p>
      <div class="btnrow"><button id="startBtn" class="primary">✨ COMENZAR</button></div>
      <p class="muted">Ismael Andrade | Coach en PNL</p>
    </div>`;document.getElementById('startBtn').addEventListener('click',()=>setStep('privacy'))}
function renderPrivacy(){screen.innerHTML=`<h2>🔒 Este espacio es solo tuyo</h2><div class="privacy"><p>Tus respuestas permanecen en este dispositivo.</p><p><b>Lo que escribas queda únicamente en tu dispositivo. Nosotros no recibimos ni tenemos acceso a tus respuestas.</b></p><p>💛 Responde desde lo que sientes <b>hoy</b>. No existen respuestas correctas o incorrectas.</p><p>Esta experiencia es un espacio de <b>reflexión y autoconocimiento</b>. No realiza diagnósticos.</p></div>${nav('cover','areas','CONTINUAR →')}`;bindNav('cover','areas')}
function renderAreas(){let h=`<h2>🎒 Mi Mochila Hoy</h2><p><b>¿Cuánto peso sientes hoy en cada una de estas áreas de tu vida?</b></p><p class="muted">No lo pienses demasiado. Responde desde cómo lo sientes hoy.</p><div class="areas">`;for(const [id,t,d] of areas){h+=`<div class="area"><div class="area-head"><div><h3>${t}</h3><small>${d}</small></div><b>${state.ratings[id]||''}</b></div><div class="scale">${[1,2,3,4,5].map(n=>`<button type="button" class="${state.ratings[id]===n?'sel':''}" data-area="${id}" data-score="${n}">${n}</button>`).join('')}</div></div>`}h+=`</div><div class="legend"><span>🪶 1 = Muy ligero</span><span>🎒 5 = Siento mucho peso</span></div>${nav('privacy','map','VER MI MOCHILA 🎒',Object.keys(state.ratings).length<5)}`;screen.innerHTML=h;screen.querySelectorAll('[data-area]').forEach(b=>b.addEventListener('click',()=>{state.ratings[b.dataset.area]=Number(b.dataset.score);save();renderAreas()}));bindNav('privacy',Object.keys(state.ratings).length===5?'map':null)}
function radarSVG(){const vals=areas.map(a=>state.ratings[a[0]]||1),cx=250,cy=230,R=150,N=5,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/N;return[cx+Math.cos(a)*r,cy+Math.sin(a)*r]};let rings='',axes='',labs='';for(let k=1;k<=5;k++)rings+=`<polygon points="${[...Array(N)].map((_,i)=>pt(i,R*k/5).join(',')).join(' ')}" fill="none" stroke="#e3d5dc"/>`;areas.forEach((a,i)=>{const[x,y]=pt(i,R),[lx,ly]=pt(i,R+38);axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#eadde3"/>`;labs+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#6f5d66">${a[1].replace(/^.. /,'')}</text>`});const dp=vals.map((v,i)=>pt(i,R*v/5).join(',')).join(' ');return `<svg class="radar" viewBox="0 0 500 460" role="img" aria-label="Mapa de la mochila">${rings}${axes}<polygon points="${dp}" fill="rgba(143,95,118,.18)" stroke="#8f5f76" stroke-width="3"/>${vals.map((v,i)=>{const[x,y]=pt(i,R*v/5);return `<circle cx="${x}" cy="${y}" r="5" fill="#8f5f76"/><text x="${x}" y="${y-12}" text-anchor="middle" font-size="13" fill="#3d2d35">${v}</text>`}).join('')}${labs}</svg>`}
function renderMap(){screen.innerHTML=`<h2>🎒 Así está mi mochila hoy</h2><p>Este mapa representa cómo percibes <b>hoy</b> distintas áreas de tu vida.</p><div class="radarwrap">${radarSVG()}</div><p>👀 Observa tu mochila por unos segundos. No busques explicarla todavía, solo reconoce cómo se ve hoy.</p><p class="muted">No existen resultados buenos o malos. <b>Simplemente observa lo que este mapa te muestra hoy.</b></p>${nav('areas','chooseArea','CONTINUAR →')}`;bindNav('areas','chooseArea')}
function renderChooseArea(){const choices=areas.map(a=>a[1]).concat(['➕ Otra área']);screen.innerHTML=`<h2>🔍 ¿Dónde quiero mirar hoy?</h2><p>Has observado distintas áreas de tu vida. Ahora elige <b>una sola</b> para trabajar durante esta experiencia.</p><p>💛 No tiene que ser la que tenga mayor puntuación. <b>Elige aquella que hoy sientas que quieres mirar.</b></p><div class="choicegrid">${choices.map(c=>`<button class="choice ${state.area===c?'sel':''}" data-choice="${c}">${c}</button>`).join('')}</div><div class="field ${state.area==='➕ Otra área'?'':'hidden'}"><label>Si quieres, puedes escribirla:</label><input id="areaOther" type="text" value="${esc(state.areaOther)}" placeholder="Opcional"></div>${nav('map','chooseLoad','CONTINUAR →',!state.area)}`;screen.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>{state.area=b.dataset.choice;save();renderChooseArea()}));document.getElementById('areaOther')?.addEventListener('input',e=>{state.areaOther=e.target.value;save()});bindNav('map',state.area?'chooseLoad':null)}
function renderChooseLoad(){screen.innerHTML=`<h2>💭 ¿Qué estoy cargando?</h2><div class="selected-summary">Has elegido mirar: <b>${displayArea()}</b></div><p>Dentro de esta área, ¿qué sientes que estás cargando hoy?</p><p><b>Elige una sola opción</b>, la que más se acerque a lo que sientes.</p><div class="choicegrid">${loads.map(c=>`<button class="choice ${state.load===c?'sel':''}" data-load="${c}">${c}</button>`).join('')}</div><div class="field ${state.load==='➕ Otra'?'':'hidden'}"><label>Si quieres, puedes escribirla:</label><input id="loadOther" type="text" value="${esc(state.loadOther)}" placeholder="Opcional"></div>${nav('chooseArea','q1','CONTINUAR →',!state.load)}`;screen.querySelectorAll('[data-load]').forEach(b=>b.addEventListener('click',()=>{state.load=b.dataset.load;save();renderChooseLoad()}));document.getElementById('loadOther')?.addEventListener('input',e=>{state.loadOther=e.target.value;save()});bindNav('chooseArea',state.load?'q1':null)}
function renderTextQuestion(q,key,back,next,hint=''){screen.innerHTML=`<h2>${q}</h2><div class="selected-summary"><b>${displayArea()}</b><br>${displayLoad()}</div>${hint?`<p class="muted">${hint}</p>`:''}<div class="field"><textarea id="answer" placeholder="Opcional">${esc(state[key])}</textarea></div>${nav(back,next,'SIGUIENTE →')}`;document.getElementById('answer').addEventListener('input',e=>{state[key]=e.target.value;save()});bindNav(back,next)}
function renderPause(){screen.innerHTML=`<div class="pause"><div class="big">🧘</div><h2>Ahora deja tu teléfono a un lado</h2><p>Has identificado algo que quieres mirar.</p><p>🎧 A partir de aquí, déjate acompañar por mi voz.</p><p class="muted">No necesitas hacer nada más en la aplicación hasta que te indique que volvamos.</p><p><b>Deja tu teléfono a un lado y ponte cómoda. 💛</b></p></div>${nav('q2','discover','HE TERMINADO EL EJERCICIO →')}`;bindNav('q2','discover')}
function renderAction(){screen.innerHTML=`<h2>👣 Mi primer paso</h2><p>No necesitas cambiarlo todo hoy.</p><p><b>¿Qué pequeña acción puedes realizar en las próximas 48 horas que dependa únicamente de ti?</b></p><div class="field"><textarea id="answer" placeholder="Opcional">${esc(state.action)}</textarea></div><div id="promptBox" class="notice hidden">💛 ¿Quieres regalarte unos segundos más para pensar en una pequeña acción?<div class="btnrow"><button id="writeBtn" class="secondary">QUIERO ESCRIBIRLA</button><button id="continueBtn" class="primary">PREFIERO CONTINUAR</button></div></div><div class="btnrow"><button id="backBtn" class="secondary">← ANTERIOR</button><button id="finishBtn" class="primary">FINALIZAR ✨</button></div>`;document.getElementById('answer').addEventListener('input',e=>{state.action=e.target.value;save()});document.getElementById('backBtn').addEventListener('click',()=>setStep('release'));document.getElementById('finishBtn').addEventListener('click',()=>{if(state.action.trim())setStep('summary');else document.getElementById('promptBox').classList.remove('hidden')});document.getElementById('writeBtn').addEventListener('click',()=>{document.getElementById('promptBox').classList.add('hidden');document.getElementById('answer').focus()});document.getElementById('continueBtn').addEventListener('click',()=>setStep('summary'))}
function renderSummary(){const items=[['Hoy elegí mirar',displayArea()],['Reconocí que estaba cargando',displayLoad()],['Descubrí',state.discover],['Quiero comenzar a soltar',state.release],['🌱 Mi primer paso será',state.action]].filter(x=>x[1]&&String(x[1]).trim());screen.innerHTML=`<div class="print-title hidden"><h1>Vacía tu Mochila</h1><p>Mi reflexión personal</p></div><h2>🎒 MI PRIMER PASO</h2><div class="summary">${items.map(([k,v])=>`<div class="summary-item"><b>${k}</b><div>${esc(v)}</div></div>`).join('')}</div><div class="pause" style="margin-top:18px"><p><b>💛 No necesitas vaciar toda tu mochila hoy.</b></p><p>✨ Hoy elegiste comenzar por algo.</p></div><div class="btnrow no-print"><button id="restartBtn" class="secondary">🔄 COMENZAR DE NUEVO</button><button id="printBtn" class="primary">📄 GUARDAR MI REFLEXIÓN</button></div>`;document.getElementById('printBtn').addEventListener('click',()=>window.print());document.getElementById('restartBtn').addEventListener('click',()=>{if(confirm('¿Deseas borrar tus respuestas y comenzar de nuevo?')){const a=localStorage.getItem(ACCESS_KEY);localStorage.removeItem(APP_KEY);if(a)localStorage.setItem(ACCESS_KEY,'1');state=defaultState();state.step='cover';save();render()}})}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=1.8',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));render();
})();
</script></body></html>
